name: Carrtell QA Guard

on:
  pull_request:
  push:
    branches:
      - main
      - 'sprint/**'
      - 'agent/**'

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run build
      - run: npm run qa:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carrtell-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
